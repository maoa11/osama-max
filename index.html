<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة أسامة</title>
<meta name="theme-color" content="#16A34A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لوحة أسامة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: 3 core colors — white, green, yellow (red only for "late") =====
   (--mint is the green token name; kept so the rest of the CSS doesn't change) */
:root{
  --bg:#F7FAF3; --surface:#FFFFFF; --surface2:#EFF5E9; --line:#DFE9D6;
  --text:#14261A; --muted:#5C6E60; --faint:#9DAE9F;
  --mint:#16A34A; --mint-deep:#0F7A37; --mint-ink:#FFFFFF; --mint-soft:rgba(22,163,74,.10); --mint-mid:rgba(22,163,74,.32);
  --sun:#FACC15; --sun-deep:#A16207; --sun-soft:#FEF6CC; --sun-ink:#3D2E00;
  --red:#DC4B3E; --red-soft:rgba(220,75,62,.1);
  --r:20px; --r-sm:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:"Tajawal",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1A12; --surface:#15241A; --surface2:#1C2F22; --line:#26402E;
  --text:#ECF5EE; --muted:#9BB3A1; --faint:#5F7A66;
  --mint:#4ADE80; --mint-deep:#22C55E; --mint-ink:#0E1A12; --mint-soft:rgba(74,222,128,.12); --mint-mid:rgba(74,222,128,.35);
  --sun:#FACC15; --sun-deep:#FACC15; --sun-soft:rgba(250,204,21,.14); --sun-ink:#FDE68A;
  --red:#F87171; --red-soft:rgba(248,113,113,.12);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.65;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.rail{display:none}
main{flex:1;min-width:0;padding:max(20px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto;width:100%}
.view{display:none}
.view.on{display:block;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom nav (mobile) */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;
  color:var(--faint);font-size:12px;font-weight:500;border-radius:12px;text-decoration:none;transition:color .2s var(--ease)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--mint)}
@media (min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:232px;flex-shrink:0;
    padding:28px 16px;border-left:1px solid var(--line)}
  .rail .brand{font-weight:800;font-size:20px;padding:0 12px 24px}
  .rail .brand span{color:var(--mint)}
  .rail a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;text-decoration:none;
    color:var(--muted);font-weight:500;transition:background .2s var(--ease),color .2s var(--ease)}
  .rail a svg{width:20px;height:20px}
  .rail a:hover{background:var(--surface)}
  .rail a.on{background:var(--mint-soft);color:var(--mint)}
  main{padding:40px 48px 64px;max-width:1180px}
}

/* ===== Type ===== */
.hello{font-size:30px;font-weight:800;line-height:1.25}
.date{color:var(--muted);font-size:15px;margin-top:2px}
h2.sec{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-title{font-size:30px;font-weight:800}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,38,26,.04),0 4px 16px rgba(20,38,26,.04)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.grid2 .card{margin:0;min-width:0}
.grid2 .big{font-size:32px}
.grid2 .big small{display:block;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:var(--r-sm);padding:12px 10px;text-align:center;min-width:0}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px 6px 12px;font-weight:800;font-size:20px;min-height:44px;flex-shrink:0}
.streak small{font-size:12px;font-weight:500;color:var(--muted)}
.streak.zero{color:var(--muted)}

/* alert */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 60%,transparent);
  color:var(--text);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.alert .dot{width:10px;height:10px;border-radius:50%;background:var(--sun);margin-top:9px;flex-shrink:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 35%,transparent)}
.alert b{color:var(--sun-deep)}
.alert ul{list-style:none}
.alert li+li{margin-top:2px}
.alert a{text-decoration:none}

/* big numbers + bars */
.big{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.label{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.bar{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;position:relative;margin-top:14px}
.bar.thin{height:6px;margin-top:8px}
.bar i{position:absolute;inset:0 0 0 auto;width:0;border-radius:999px;transition:width .3s var(--ease)}
.bar .fill{background:var(--mint)}
.bar .ghost{background:var(--mint-mid)}
.sub{font-size:13px;color:var(--muted);margin-top:8px}
.tap{display:block;text-decoration:none;color:inherit;transition:border-color .2s var(--ease)}
.tap:hover{border-color:var(--mint-mid)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px}

/* forms + buttons */
.quick{display:flex;gap:8px;margin-bottom:8px}
.quick input,.search{flex:1;min-width:0;min-height:48px;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);
  padding:0 14px;outline:none;transition:border-color .2s var(--ease);width:100%}
.quick input:focus,.search:focus{border-color:var(--mint-mid)}
.btn{min-height:48px;min-width:48px;padding:0 18px;border-radius:var(--r-sm);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .2s var(--ease),opacity .2s var(--ease);text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-mint{background:var(--mint);color:var(--mint-ink)}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn-line{border:1px solid var(--line);color:var(--text)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{min-height:44px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);padding:0 4px;white-space:nowrap}
.seg button.on{background:var(--mint-soft);color:var(--mint);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chips button.on{border-color:var(--mint);color:var(--mint)}

/* lists */
.tasks,.list{list-style:none}
.task{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;margin:-6px}
.check span{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;
  transition:background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease)}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .25s var(--ease),transform .25s var(--ease);color:var(--mint-ink)}
.task.done .check span{background:var(--mint);border-color:var(--mint)}
.task.done .check svg{opacity:1;transform:none}
.task .t{flex:1;min-width:0;cursor:pointer}
.task .t b{display:block;font-weight:500;transition:color .25s var(--ease)}
.task.done .t b,.task.done .t{color:var(--faint);text-decoration:line-through}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;text-decoration:none}
.task .meta .late{color:var(--red);font-weight:700}
.task.dragging{background:var(--surface2);border-radius:12px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.grab{width:44px;height:44px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex-shrink:0;margin:-6px}
.grab svg{width:18px;height:18px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.p1,.chip.red{background:var(--red-soft);color:var(--red)}
.chip.ok{background:var(--mint-soft);color:var(--mint)}
.more{width:100%;min-height:44px;color:var(--muted);font-size:14px;font-weight:500;border-radius:var(--r-sm);margin-top:4px}
.more:hover{background:var(--surface2)}
.item{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;cursor:pointer}
.item .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{text-align:left;flex-shrink:0;font-weight:700}
.pill{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--muted);flex-shrink:0;white-space:nowrap}
.pill.ok{background:var(--mint-soft);color:var(--mint)}
.pill.red{background:var(--red-soft);color:var(--red)}
.wa{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--mint-soft);color:var(--mint);flex-shrink:0}
.wa svg{width:22px;height:22px}

/* pending items */
.pend{list-style:none}
.pend li{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.pend li:last-child{border-bottom:0}
.pend li .t{flex:1;min-width:0;font-size:15px}
.pend li.urgent .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:middle}
.x{width:44px;height:44px;display:grid;place-items:center;color:var(--faint);border-radius:10px;flex-shrink:0}
.x:hover{color:var(--red);background:var(--red-soft)}
.x svg{width:18px;height:18px}

/* quote */
.quote{background:var(--sun-soft);border-color:color-mix(in srgb,var(--sun) 50%,transparent)}
.quote p{border-right:4px solid var(--sun);padding-right:14px;color:var(--sun-ink);font-size:19px;font-weight:700;line-height:1.7}

/* backup strip */
.backup{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 4px 16px}
.backup[hidden]{display:none}
.backup .sub{margin:0}

/* empty */
.empty{color:var(--muted);font-size:15px;padding:8px 0 4px;list-style:none}
.empty b{color:var(--text)}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.hbars{list-style:none}
.hbars li{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;min-height:36px;font-size:14px}
.hbars .track{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;position:relative}
.hbars .track i{position:absolute;inset:0 0 0 auto;background:var(--mint);border-radius:999px}
.hbars li.best .track i{background:var(--mint)}
.hbars li:not(.best) .track i{background:var(--mint-mid)}
.hbars em{font-style:normal;font-weight:700;text-align:left}
.vbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vbars i{width:100%;max-width:32px;background:var(--mint);border-radius:6px 6px 2px 2px;min-height:2px}
.vbars span{font-size:11px;color:var(--muted)}

/* insight box (performance) */
.insight{background:var(--mint-soft);border:1px solid var(--mint-mid);border-radius:var(--r);padding:16px;margin-top:16px}
.insight p{font-weight:700;font-size:17px;line-height:1.7;margin-bottom:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s var(--ease);max-height:88vh;overflow:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:18px;margin-bottom:16px}
@media (min-width:900px){.sheet{inset:50% auto auto 50%;transform:translate(-50%,-46%);width:500px;border-radius:24px;border:1px solid var(--line);opacity:0}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu a{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-radius:14px;background:var(--surface2);text-decoration:none;font-weight:500}
.menu a svg{width:22px;height:22px;color:var(--mint)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 14px;outline:none}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint-mid)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--mint)}
.info{font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.7}
.info b{color:var(--text);font-weight:700}
.log{list-style:none;font-size:14px;margin-top:8px}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li small{color:var(--muted);margin-left:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;
  background:var(--text);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);width:max-content;max-width:calc(100% - 32px);font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:800;min-height:40px;padding:0 10px;color:var(--bg);text-decoration:underline}
@media (min-width:900px){.toast{bottom:32px}}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .3s var(--ease)}

/* ===== reports (editor) ===== */
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.brand-dots{display:flex;gap:4px}
.brand-dots i{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);display:block}
.brand-logo{height:36px;max-width:120px;object-fit:contain;background:var(--surface2);border-radius:8px;padding:4px}
.rnum{width:30px;height:30px;border-radius:9px;background:var(--mint-soft);color:var(--mint);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.rep-add{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.rep-swatch{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}
.rep-swatch img{width:80%;height:80%;object-fit:contain}

/* ===== report viewer + document ===== */
#report{position:fixed;inset:0;z-index:70;background:#E6ECEC;overflow:auto;-webkit-overflow-scrolling:touch}
body.rep-open{overflow:hidden}
.rbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #d5dede;color:#14261A}
.rbar .sp{flex:1}
.rbar .btn-ghost{background:#EEF3F1;color:#14261A}
#report-pages{padding:12px}
.rdoc{display:flex;flex-direction:column;gap:12px;align-items:center}
.rpage{width:1123px;height:794px;flex-shrink:0;background:#fff;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);
  padding:56px 64px;color:var(--d);font-family:"Tajawal",system-ui,sans-serif;direction:rtl;line-height:1.6;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpage header{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:flex-start;gap:24px}
.rpage header h2{font-size:40px;font-weight:800;line-height:1.2}
.rpage header p{font-size:18px;color:#4E6066;margin-top:6px}
.rlogo{height:40px;max-width:170px;object-fit:contain}
.wordmark{font-weight:800;color:var(--d);white-space:nowrap}
.rlogo.wordmark{height:auto;font-size:26px}
.rpage footer{position:absolute;bottom:26px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:13px;color:#8A9AA0}
/* cover */
.rpage.cover{background:var(--p);padding:0}
.cover .sh{position:absolute;background:var(--s);display:block}
.cover .sh1{left:260px;top:0;width:300px;height:310px}
.cover .sh2{left:150px;top:150px;width:240px;height:220px;border-radius:26px;transform:skewX(-5deg)}
.cover .sh3{left:-40px;top:360px;width:380px;height:520px;border-radius:220px 220px 0 0}
.clogo{position:absolute;top:56px;right:64px;height:60px;max-width:240px;object-fit:contain}
.clogo.wordmark{height:auto;font-size:40px}
.ctext{position:absolute;right:64px;bottom:96px;left:520px;text-align:right}

<script>
/* =========================================================
   لوحة أسامة — one file, offline, everything editable in-app.
   Values in seed() are only the FIRST-RUN data; after that the
   app reads/writes localStorage and never overwrites edits.
   ========================================================= */
var KEY = 'osama_board_v1';

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function dkey(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mkey(d){ return dkey(d).slice(0,7); }
function addDays(k,n){ var p=k.split('-'), d=new Date(+p[0],p[1]-1,+p[2]); d.setDate(d.getDate()+n); return dkey(d); }
function addMonths(k,n){ var p=k.split('-'), d=new Date(+p[0],p[1]-1+n,+p[2]); return dkey(d); }
function weekStart(k){ var p=k.split('-'), d=new Date(+p[0],p[1]-1,+p[2]); d.setDate(d.getDate()-((d.getDay()+1)%7)); return dkey(d); } // week starts Saturday
// parse numbers typed with Arabic or Western digits
function num(v){ var s=String(v==null?'':v).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace(/[٫,]/g,'.').replace(/[^\d.\-]/g,''); var x=parseFloat(s); return isNaN(x)?0:x; }


function seed(){
  return {
    version: 1,
    createdAt: new Date().toISOString(),
    lastBackup: null, lastNotify: null,
    settings: {
      name: 'أسامة', city: 'جدة',
      incomeGoal: 15000, goalMonths: 6,
      videoGoal: 20, timeGoal: 2, timeStart: 3.5,
      theme: 'light', notify: false, sound: true,
      projects: ['سلة','رام','رغد','شخصي','تعلّم']
    },
    sources: [
      { id:'salla', name:'سلة', kind:'invoice', amount:6000, active:true,
        note:'مونتاج فقط · 20 فيديو/شهر · فواتير (contractor) · تفاوض على الرفع: الهدف 8500، المقبول 7500 · الوسيط محمد، المديرة فاطمة' },
      { id:'ram', name:'رام', kind:'salary', amount:3500, active:true, rate:10,
        note:'مبيعات + مونتاج · عمولة 10% من قيمة العقد · زيادة 40% على الراتب عند تارجت 10000 بالشهر' },
      { id:'raghad', name:'وكالة رغد', kind:'pending', amount:0, active:true,
        note:'«ذراعها اليمين» / إدارة الوكالة + نسبة — غير محسومة',
        questions:[
          'النسبة كم؟ وعلى قيمة العقد ولا الربح؟',
          'تنصرف متى — عند التوقيع ولا عند التحصيل؟',
          'على أي عملاء — الي أجيبهم أنا ولا كل عملاء الوكالة؟',
          'كم ساعة بالأسبوع متوقعة؟ ومتى نرجع لموضوع الراتب (بتاريخ)؟'
        ] }
    ],
    tasks: [],
    pending: [
      { id:uid(), text:'رفع راتب سلة — إرسال رسالة التفاوض', urgent:false, done:false },
      { id:uid(), text:'رغد — إرسال الأسئلة الأربعة', urgent:false, done:false },
      { id:uid(), text:'اللوقو الرسمي لـ«ديوانية سلة» — أطلبه من محمد', urgent:false, done:false }
    ],
    videos: [], perf: [], invoices: [], commissions: [], incomeLog: [],
    clients: [
      { id:'rehama', name:'ريهام عبدالله', sector:'مونتاج', phone:'', billing:'piece', amount:0, start:dkey(), active:true, note:'@by.rehama', pieces:[], createdAt:Date.now() }
    ],
    plan90: {
      start: dkey(),
      phases: [
        { name:'يوم 1–30', items:[
          { id:uid(), text:'صفر تأخير', done:false },
          { id:uid(), text:'بناء قوالب Resolve/AE', done:false },
          { id:uid(), text:'بدء جدول تتبع الأداء بصمت', done:false } ] },
        { name:'يوم 30–60', items:[
          { id:uid(), text:'وقت الفيديو ينزل من 3.5 ساعة لساعتين', done:false },
          { id:uid(), text:'بدء تعلم After Effects', done:false },
          { id:uid(), text:'إرسال أول ريل إضافي بدون ما أحد يطلب', done:false } ] },
        { name:'يوم 60–90', items:[
          { id:uid(), text:'عرض تحليل الـ30 فيديو بالأرقام', done:false },
          { id:uid(), text:'طلب تجربة قالب جديد', done:false } ] }
      ]
    },
    learning: [], monthlyGoals: [], wins: [],
    reports: [],
    brands: { salla: { logo:'', primary:'#2EF2C9', soft:'#AEFCE5', dark:'#004855', accent:'#FDE68A' } },
    brand: { mint:'#B2F1DC', aqua:'#B2F1F1', teal:'#004855', size:'1080×1920 · 30fps', font:'Tajawal', audio:'-14 LUFS · True Peak -1 dBTP' },
    doneDays: []
  };
}

var S;
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){ S = null; }
  if(!S || !S.version){ S = seed(); save(); }
  // removed the residency topic: drop it from data saved by the first release
  if(S.legal){ delete S.legal; S.pending = S.pending.filter(function(p){ return p.text.indexOf('وضع الإقامة')!==0; }); }
  // forward-compat: add any keys a newer seed introduced, never overwrite
  var base = seed();
  for(var k in base){ if(!(k in S)) S[k] = base[k]; }
  for(var s in base.settings){ if(!(s in S.settings)) S.settings[s] = base.settings[s]; }
  // first release stored long source objects; keep their fields, only add the note if missing
  // v4: sales/leads section removed; private clients moved out of sources into S.clients; bright theme
  delete S.leads; delete S.leadsImported; delete S.settings.waTemplate; delete S.settings.waMode;
  S.sources = S.sources.filter(function(src){
    if(src.kind!=='client') return true;
    if(!byId(S.clients, src.id)) S.clients.push({ id:src.id, name:src.name, sector:src.id==='rehama'?'مونتاج':'', phone:'', billing:'piece', amount:num(src.amount), start:dkey(), active:true, note:src.id==='rehama'?'@by.rehama':(src.note||''), pieces:[], createdAt:Date.now() });
    return false;
  });
  if(!S.paletteV2){ S.settings.theme = 'light'; S.paletteV2 = true; }
  S.sources.forEach(function(src){ var b = base.sources.filter(function(x){return x.id===src.id;})[0]; if(b && !src.note) src.note = b.note; if(src.id==='raghad' && src.kind==='pending') src.active = true; });
  save();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('ما قدرت أحفظ — صدّر نسخة احتياطية'); }
}

/* ---------- formatting ---------- */
var NF = new Intl.NumberFormat('ar-SA-u-nu-arab');
function n(x){ return NF.format(Math.round(x||0)); }
function nd(x,d){ return new Intl.NumberFormat('ar-SA-u-nu-arab',{maximumFractionDigits:d==null?1:d}).format(x||0); }
function longDate(d){ return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{weekday:'long',day:'numeric',month:'long'}).format(d); }
function shortDate(k){ if(!k) return ''; var p=k.split('-'); return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{day:'numeric',month:'short'}).format(new Date(+p[0],p[1]-1,+p[2])); }
function monthName(mk){ var p=mk.split('-'); return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'short'}).format(new Date(+p[0],p[1]-1,1)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a))/864e5); }
function byId(list,id){ return list.filter(function(x){return x.id===id;})[0]; }
function $(id){ return document.getElementById(id); }

/* ---------- icons ---------- */
var I = {

  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',

  wa:'<path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-2.1-2.1l.8-1-1-2z"/>'
};
function ico(name,sw){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[name]+'</svg>'; }

/* ---------- navigation ---------- */
var ROUTES = [
  { id:'today',    label:'اليوم',     icon:'today',    tab:true },
  { id:'money',    label:'الفلوس',    icon:'money',    tab:true },
  { id:'clients',  label:'عملائي',    icon:'clients',  tab:true },
  { id:'salla',    label:'سلة',       icon:'salla',    tab:true },
  { id:'tasks',    label:'المهام',    icon:'tasks' },
  { id:'perf',     label:'الأداء',    icon:'perf' },
  { id:'reports',  label:'التقارير',  icon:'report' },
  { id:'goals',    label:'الأهداف',   icon:'goals' },
  { id:'settings', label:'الإعدادات', icon:'settings' }
];
var current = 'today';
function buildNav(){
  var rail = $('rail'), bar = $('tabbar');
  ROUTES.forEach(function(r){
    rail.insertAdjacentHTML('beforeend','<a href="#'+r.id+'" data-r="'+r.id+'">'+ico(r.icon)+'<span>'+r.label+'</span></a>');

function monthIncome(mk){
  mk = mk || mkey(new Date());
  var expected = 0, received = 0, rows = [];
  S.sources.forEach(function(s){
    if(!s.active) return;
    if(s.kind==='salary'||s.kind==='invoice'){ expected += num(s.amount); rows.push({name:s.name, v:num(s.amount), id:s.id}); }
    else if(s.kind==='pending'){ rows.push({name:s.name, v:null, id:s.id}); }
  });
  // private clients: monthly ones count at their monthly fee; per-piece / one-time count what came in this month
  if(S.clients.length){
    var cm = S.clients.filter(function(c){return c.billing==='monthly' && c.active!==false;}).reduce(function(a,c){return a+num(c.amount);},0);
    var co = S.incomeLog.filter(function(p){ var c = byId(S.clients,p.source); return c && c.billing!=='monthly' && (p.date||'').slice(0,7)===mk; }).reduce(function(a,p){return a+num(p.amount);},0);
    expected += cm + co; rows.push({name:'عملائي الخاصين', v:cm+co, id:'_clients'});
  }
  var com = S.commissions.filter(function(c){return (c.date||'').slice(0,7)===mk;}).reduce(function(a,c){return a+commissionAmt(c);},0);
  if(com || S.commissions.length){ expected += com; rows.push({name:'عمولات', v:com, id:'_com'}); }
  received = receivedIn(mk);
  return { expected:expected, received:received, rows:rows };
}
function receivedIn(mk){
  var r = S.incomeLog.filter(function(p){return (p.date||'').slice(0,7)===mk;}).reduce(function(a,p){return a+num(p.amount);},0);
  r += S.commissions.filter(function(c){return c.paid && (c.paidDate||'').slice(0,7)===mk;}).reduce(function(a,c){return a+commissionAmt(c);},0);
  return r;
}

function streak(){
  var set = {}; S.doneDays.forEach(function(d){ set[d]=1; });
  var d = new Date(), c = 0;
  if(!set[dkey(d)]) d.setDate(d.getDate()-1);
  while(set[dkey(d)]){ c++; d.setDate(d.getDate()-1); }
  return c;
}
function smartSort(a,b){
  var t = dkey();
  var al = a.date && a.date<t ? 0 : a.date===t ? 1 : a.date ? 2 : 3, bl = b.date && b.date<t ? 0 : b.date===t ? 1 : b.date ? 2 : 3;
  if(al!==bl) return al-bl;
  if((a.priority||2)!==(b.priority||2)) return (a.priority||2)-(b.priority||2);
  if(al===2 && a.date!==b.date) return a.date<b.date?-1:1;
  return (a.order||0)-(b.order||0);
}

/* drag & drop ordering (pointer events → works with touch and mouse) */
(function(){
  var li=null, startY=0, list=null;
  document.addEventListener('pointerdown', function(e){
    var g = e.target.closest('.grab'); if(!g) return;
    li = g.closest('li'); list = li.parentNode; startY = e.clientY;
    li.classList.add('dragging'); g.setPointerCapture(e.pointerId); e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){
    if(!li) return;
    var dy = e.clientY - startY; li.style.transform = 'translateY('+dy+'px)';
    var sib = dy>0 ? li.nextElementSibling : li.previousElementSibling;
    if(sib && sib.classList.contains('task')){
      var h = sib.offsetHeight;
      if(Math.abs(dy) > h/2){
        if(dy>0) list.insertBefore(sib, li); else list.insertBefore(li, sib);
        startY += dy>0 ? h : -h; li.style.transform = 'translateY('+(e.clientY-startY)+'px)';
      }
    }
  });
  function end(){
    if(!li) return;
    li.classList.remove('dragging'); li.style.transform='';
    var ids = [].map.call(list.querySelectorAll('.task'), function(el){return el.dataset.id;});
    var orders = ids.map(function(id){return byId(S.tasks,id).order||0;}).sort(function(a,b){return a-b;});
    ids.forEach(function(id,i){ byId(S.tasks,id).order = orders[i] + i*1e-6; });
    li=null; save();
  }
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();

function setVideoStage(v, st){
  v.stage = st;
  if(st==='delivered' && !v.deliveredAt) v.deliveredAt = new Date().toISOString();
  if(st!=='delivered') v.deliveredAt = null;
}

var HOOKS = ['رقم','سؤال','ادعاء مفاجئ','قصة'];
var HOOK_PHRASE = { 'رقم':'برقم', 'سؤال':'بسؤال', 'ادعاء مفاجئ':'بادعاء مفاجئ', 'قصة':'بقصة' };
function perfAnalysis(){
  var rows = S.perf.filter(function(p){return num(p.views)>0 || num(p.ret3)>0;});
  var byHook = HOOKS.map(function(h){
    var r = rows.filter(function(p){return p.hook===h && num(p.ret3)>0;});
    return { hook:h, n:r.length, ret: r.length ? r.reduce(function(a,p){return a+num(p.ret3);},0)/r.length : 0 };
  }).filter(function(x){return x.n;});
  var buckets = [['أقل من ٢٠ث',0,20],['٢٠–٤٠ث',20,40],['٤٠–٦٠ث',40,60],['أكثر من ٦٠ث',60,1e9]].map(function(b){
    var r = rows.filter(function(p){ var l=num(p.len); return l>=b[1] && l<b[2] && num(p.views)>0; });
    return { label:b[0], n:r.length, rate: r.length ? r.reduce(function(a,p){return a+num(p.saves)/num(p.views)*100;},0)/r.length : 0 };
  }).filter(function(x){return x.n;});
  var sentence = '';
  if(byHook.length>=2){
    var s = byHook.slice().sort(function(a,b){return b.ret-a.ret;}), best = s[0], worst = s[s.length-1];
    var diff = worst.ret ? Math.round((best.ret-worst.ret)/worst.ret*100) : 0;
    sentence = 'حللت آخر '+n(rows.length)+(rows.length<=10?' فيديوهات':' فيديو')+' — الي تبدأ '+HOOK_PHRASE[best.hook]+' احتفاظها في أول ٣ ثواني أعلى بـ'+n(diff)+'٪ من الي تبدأ '+HOOK_PHRASE[worst.hook]+' ('+nd(best.ret)+'٪ مقابل '+nd(worst.ret)+'٪).';
  }
  return { rows:rows, byHook:byHook, buckets:buckets, sentence:sentence };
}
function renderPerf(){
  var A = perfAnalysis(), N = S.perf.length, need = 10, html = '';
  if(N < need){
    html += '<div class="card"><div class="label">التحليل التلقائي</div><div class="big num">'+n(N)+' <small>/ '+n(need)+' فيديو</small></div>'+bar(N/need*100)+
      '<div class="sub">أول ما توصل ١٠ فيديوهات منشورة يطلع لك وش نوع الهوك الأقوى، وجملة جاهزة ترسلها لفاطمة.</div></div>';
  } else {
    var mx = Math.max.apply(null, A.byHook.map(function(h){return h.ret;}).concat([1]));
    var topHook = A.byHook.slice().sort(function(a,b){return b.ret-a.ret;})[0];
    html += '<div class="card"><h2 class="sec"><span>متوسط الاحتفاظ (أول ٣ ثواني) لكل هوك</span></h2>'+
      (A.byHook.length ? '<ul class="hbars">'+A.byHook.map(function(h){
        return '<li class="'+(h===topHook?'best':'')+'"><span>'+h.hook+' <small style="color:var(--muted)">('+n(h.n)+')</small></span><div class="track"><i style="width:'+(h.ret/mx*100)+'%"></i></div><em class="num">'+nd(h.ret)+'٪</em></li>';
      }).join('')+'</ul>' : '<div class="empty">أدخل نسبة الاحتفاظ للفيديوهات عشان يطلع الرسم.</div>')+
      (A.sentence ? '<div class="insight"><p id="insight-text">'+esc(A.sentence)+'</p><button class="btn btn-mint btn-sm" data-act="copy-insight">نسخ الجملة لفاطمة</button></div>' : '')+'</div>';
    var bx = Math.max.apply(null, A.buckets.map(function(b){return b.rate;}).concat([0.01]));
    html += '<div class="card"><h2 class="sec"><span>طول الفيديو ↔ نسبة الحفظ</span></h2>'+
      (A.buckets.length ? '<ul class="hbars">'+A.buckets.map(function(b){
        return '<li class="'+(b.rate===bx?'best':'')+'"><span>'+b.label+'</span><div class="track"><i style="width:'+(b.rate/bx*100)+'%"></i></div><em class="num">'+nd(b.rate,2)+'٪</em></li>';
      }).join('')+'</ul><div class="sub">نسبة الحفظ = الحفظ ÷ المشاهدات</div>' : '<div class="empty">أدخل الطول والمشاهدات والحفظ.</div>')+'</div>';
  }
  var list = S.perf.slice().sort(function(a,b){return (b.date||'')<(a.date||'')?-1:1;});
  html += '<div class="card"><h2 class="sec"><span>الفيديوهات المنشورة</span></h2><ul class="list">'+
    (list.length ? list.map(function(p){
      return '<li class="item" data-pfid="'+p.id+'"><div class="t" data-act="perf-edit"><b>'+esc(p.name)+'</b><small>'+[p.hook, p.date?shortDate(p.date):'', num(p.len)?n(p.len)+'ث':''].filter(Boolean).join(' · ')+'</small></div>'+
        '<div class="end num">'+(num(p.ret3)?nd(num(p.ret3))+'٪':'—')+'<small style="display:block;font-size:11px;color:var(--muted);font-weight:500">'+(num(p.views)?n(p.views)+' مشاهدة':'')+'</small></div></li>';
    }).join('') : '<li class="empty">أضف أول فيديو منشور — الأهم: نوع الهوك ونسبة الاحتفاظ.</li>')+'</ul></div>';
  $('v-perf').innerHTML = hdr('أداء المحتوى','<button class="btn btn-mint btn-sm" data-act="perf-add">+ فيديو</button>') + html;
}

      (inv.length?'<div class="sub">اضغط «صدرت» لما تستلم المبلغ — ينضاف للدخل تلقائياً.</div>':'')+'</div>';
  }

  }
  if(tab==='tools'){
    html += '<div class="card"><h2 class="sec"><span>فواتير ← راتب ثابت</span></h2>'+
      '<div class="field"><label>مبلغ الفواتير الشهري</label><input id="calc1" inputmode="decimal" value="'+n(num((sourceById('salla')||{}).amount)).replace(/٬/g,'')+'"></div>'+

      '<div class="field"><label>المبلغ</label><input id="calc2a" inputmode="decimal" value="8500"></div>'+

      '<div class="big num" id="calc2-out"></div><div class="sub">ريال للفيديو</div></div>';
  }
  $('v-money').innerHTML = html;
  if(tab==='tools'){

    ['calc1','calc2a','calc2b'].forEach(function(i){ $(i).oninput = c; }); c();
  }
}

function toggleInvoice(id){
  var v = byId(S.invoices,id); if(!v) return;
  if(v.status==='issued'){
    v.status='received'; v.receivedAt=dkey();
    var src = S.sources.filter(function(s){return s.name===v.party;})[0];
    var p = { id:uid(), source: src?src.id:'other', amount:num(v.amount), date:dkey(), note:'فاتورة '+(v.no?'#'+v.no:'') };
    S.incomeLog.push(p); v.incomeId = p.id; chime();
    toast('انستلمت وانضافت للدخل', function(){ v.status='issued'; S.incomeLog = S.incomeLog.filter(function(x){return x.id!==p.id;}); v.incomeId=null; save(); render(); });
  } else {
    v.status='issued'; S.incomeLog = S.incomeLog.filter(function(x){return x.id!==v.incomeId;}); v.incomeId=null;
  }
  save(); render();
}

/* =========================================================
   عملائي — العملاء الخاصين
   billing: monthly (شهري) · piece (قطاعي — بالقطعة) · once (مرة واحدة)
   payments live in S.incomeLog with source = client id
   ========================================================= */
var BILLING = [['monthly','شهري'],['piece','قطاعي (بالقطعة)'],['once','مرة واحدة']];
var BILL_SHORT = { monthly:'شهري', piece:'قطاعي', once:'مرة واحدة' };
var AMT_LABEL = { monthly:'المبلغ الشهري', piece:'سعر القطعة', once:'المبلغ كامل' };
var SECTORS = ['مونتاج','تصوير','تصميم','إعلانات','سوشال ميديا','مطاعم ومقاهي','عقار','تجميل','متاجر','شركات'];
function waNum(raw){
  var d = String(raw||'').replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632;}).replace(/[^\d]/g,'');
  if(d.indexOf('00966')===0) d=d.slice(5);
  if(d.indexOf('966')===0) d=d.slice(3);
  if(d.indexOf('0')===0) d=d.slice(1);
  return d ? '966'+d : '';
}
var UA = navigator.userAgent, IS_ANDROID = /Android/i.test(UA), IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function waHref(phone){
  var p = waNum(phone); if(!p) return '';
  var web = 'https://wa.me/'+p;
  // Android: package=com.whatsapp is PERSONAL WhatsApp (Business is com.whatsapp.w4b)
  if(IS_ANDROID) return 'intent://send?phone='+p+'#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url='+encodeURIComponent(web)+';end';
  if(IS_IOS) return 'whatsapp://send?phone='+p;
  return web;
}
function monthsBetween(startMk, endMk){ var a=startMk.split('-'), b=endMk.split('-'); return Math.max(0,(+b[0]-a[0])*12 + (+b[1]-a[1]) + 1); }
function clientPayments(c){ return S.incomeLog.filter(function(p){return p.source===c.id;}); }
function clientPaid(c){ return clientPayments(c).reduce(function(a,p){return a+num(p.amount);},0); }
function clientPieces(c){ return (c.pieces||[]).reduce(function(a,p){return a+num(p.count);},0); }
function clientDue(c){
  if(c.billing==='once') return num(c.amount);
  if(c.billing==='piece') return clientPieces(c)*num(c.amount);
  var end = c.active===false && c.endMonth ? c.endMonth : mkey(new Date());
  return monthsBetween((c.start||dkey()).slice(0,7), end) * num(c.amount);
}
function clientLeft(c){ return Math.max(0, clientDue(c) - clientPaid(c)); }
function renderClients(){
  var C = S.clients, mk = mkey(new Date()), v = UI.clientView;
  var owed = C.reduce(function(a,c){return a+clientLeft(c);},0);
  var monthly = C.filter(function(c){return c.billing==='monthly' && c.active!==false;}).reduce(function(a,c){return a+num(c.amount);},0);
  var gotMonth = S.incomeLog.filter(function(p){return byId(C,p.source) && (p.date||'').slice(0,7)===mk;}).reduce(function(a,p){return a+num(p.amount);},0);
  var list = C.filter(function(c){return v==='all' || c.billing===v;})
    .sort(function(a,b){ return clientLeft(b)-clientLeft(a) || (b.createdAt||0)-(a.createdAt||0); });
  $('v-clients').innerHTML = hdr('عملائي','<button class="btn btn-mint" data-act="client-add">+ عميل</button>')+
    '<div class="card hero-sun"><div class="label">مستحق لك من العملاء</div><div class="big num">'+n(owed)+' <small>ريال</small></div>'+
      '<div class="stats" style="margin-top:16px">'+
      '<div class="stat"><b class="num">'+n(C.length)+'</b><span>عميل</span></div>'+
      '<div class="stat"><b class="num">'+n(monthly)+'</b><span>شهري ثابت</span></div>'+
      '<div class="stat"><b class="num">'+n(gotMonth)+'</b><span>استلمت هالشهر</span></div></div></div>'+
    (C.length ? seg('clientView',[['all','الكل'],['monthly','شهري'],['piece','قطاعي'],['once','مرة']],v) : '')+
    (list.length ? '<div class="cgrid">'+list.map(clientCard).join('')+'</div>'
      : '<div class="card"><div class="empty">'+(C.length?'ما فيه عملاء بهالنوع.':'أضف أول عميل خاص: الاسم، القطاع، الرقم، المبلغ، وطريقة التحصيل (شهري / قطاعي / مرة).')+'</div></div>');
}
function clientCard(c){
  var left = clientLeft(c), href = waHref(c.phone);
  var price = num(c.amount) ? n(c.amount)+' '+(c.billing==='monthly'?'/ شهر':c.billing==='piece'?'/ قطعة':'') : 'حدد المبلغ';
  return '<div class="card client" data-cid="'+c.id+'">'+
    '<div class="client-top" data-act="client-open"><div class="t"><b>'+esc(c.name)+'</b><small>'+esc([c.sector, BILL_SHORT[c.billing]].filter(Boolean).join(' · '))+(c.active===false?' · موقوف':'')+'</small></div>'+
      '<div class="end"><span class="num">'+price+'</span>'+(left ? '<span class="chip sun num">باقي '+n(left)+'</span>' : (clientDue(c)?'<span class="chip ok">مدفوع ✓</span>':''))+'</div></div>'+
    '<div class="btns" style="margin-top:12px">'+
      '<button class="btn btn-mint btn-sm" data-act="client-pay">+ دفعة</button>'+
      (c.billing==='piece'?'<button class="btn btn-ghost btn-sm" data-act="client-piece">+ قطعة</button>':'')+
      (href?'<a class="btn btn-ghost btn-sm" href="'+esc(href)+'" target="_blank" rel="noopener" aria-label="واتساب">'+ico('wa')+'</a>':'')+
      (c.phone?'<a class="btn btn-ghost btn-sm" href="tel:'+esc(c.phone)+'" aria-label="اتصال">'+ico('phone')+'</a>':'')+
    '</div></div>';
}
function clientSheet(id){

    .concat((c.pieces||[]).map(function(p){ return { d:p.date, t:n(p.count)+' قطعة'+(p.note?' · '+p.note:''), k:'piece', id:p.id }; }))
    .sort(function(a,b){ return (b.d||'')<(a.d||'')?-1:1; });
  openSheet('<h3>'+esc(c.name)+'</h3>'+
    '<div class="info">'+[c.sector, BILL_SHORT[c.billing]+(num(c.amount)?' · '+n(c.amount):''), c.phone?'<span class="num" dir="ltr">'+esc(c.phone)+'</span>':''].filter(Boolean).join(' · ')+
      (c.billing==='monthly'?'<br>من '+shortDate(c.start)+(c.active===false?' — موقوف':''):'')+(c.note?'<br>'+esc(c.note):'')+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b class="num">'+n(due)+'</b><span>'+(c.billing==='piece'?n(clientPieces(c))+' قطعة':'المستحق')+'</span></div>'+
      '<div class="stat"><b class="num">'+n(paid)+'</b><span>استلمت</span></div>'+
      '<div class="stat"><b class="num">'+n(Math.max(0,due-paid))+'</b><span>الباقي</span></div></div>'+
    '<div class="btns" style="margin-top:14px"><button class="btn btn-mint" data-act="client-pay" data-cid2="'+c.id+'">+ دفعة</button>'+
      (c.billing==='piece'?'<button class="btn btn-ghost" data-act="client-piece" data-cid2="'+c.id+'">+ قطعة</button>':'')+'</div>'+
    ((href||c.phone)?'<div class="btns" style="margin-top:8px">'+(href?'<a class="btn btn-line" href="'+esc(href)+'" target="_blank" rel="noopener">واتساب</a>':'')+(c.phone?'<a class="btn btn-line" href="tel:'+esc(c.phone)+'">اتصال</a>':'')+'</div>':'')+
    '<h2 class="sec" style="margin-top:20px"><span>السجل</span></h2><ul class="list">'+
      (hist.length ? hist.map(function(h){ return '<li class="item" data-hk="'+h.k+'" data-hid="'+h.id+'"><div class="t"><b>'+esc(h.t)+'</b><small>'+shortDate(h.d)+'</small></div><button class="x" data-act="client-hist-del" data-cid2="'+c.id+'" aria-label="حذف">'+ico('x')+'</button></li>'; }).join('')
        : '<li class="empty">ما فيه دفعات بعد.</li>')+'</ul>'+
    '<button class="btn btn-ghost btn-block" style="margin-top:16px" data-act="rep-client" data-cid2="'+c.id+'">تقرير شهري لهالعميل</button>'+
    '<div class="btns" style="margin-top:10px"><button class="btn btn-line" data-act="client-del" data-cid2="'+c.id+'">حذف</button><button class="btn btn-ghost" data-act="client-edit" data-cid2="'+c.id+'">تعديل</button></div>');
}
function clientEditSheet(id){

  var sectors = uniq(SECTORS.concat(S.clients.map(function(x){return x.sector;})));

    fld('طريقة التحصيل','<div class="chips" style="margin:0">'+BILLING.map(function(b){return '<button type="button" data-bill="'+b[0]+'" class="'+(c.billing===b[0]?'on':'')+'">'+b[1]+'</button>';}).join('')+'</div><input type="hidden" name="billing" value="'+c.billing+'">')+
    '<div class="row">'+fld('<span id="amt-label">'+AMT_LABEL[c.billing]+'</span>','<input name="amount" inputmode="decimal" required value="'+esc(c.amount)+'">')+
      '<div class="field" id="start-wrap"'+(c.billing==='monthly'?'':' hidden')+'><label>من تاريخ</label><input type="date" name="start" value="'+esc(c.start||dkey())+'"></div></div>'+
    '<label class="switch" id="active-wrap"'+(c.billing==='monthly'?'':' hidden')+'><span>العقد الشهري شغّال</span><input type="checkbox" name="active" '+(c.active!==false?'checked':'')+'></label>'+
    fld('ملاحظة','<input name="note" value="'+esc(c.note)+'">')+
    '<button class="btn btn-mint btn-block">حفظ</button></form>');
  var form = $('clf');
  form.querySelectorAll('[data-bill]').forEach(function(b){ b.onclick = function(){
    form.querySelectorAll('[data-bill]').forEach(function(x){ x.classList.toggle('on', x===b); });

    $('start-wrap').hidden = $('active-wrap').hidden = b.dataset.bill!=='monthly';
  }; });
  form.onsubmit = function(e){
    e.preventDefault(); var f = formData(form);
    if(!id){ c = { id:'c_'+uid(), pieces:[], createdAt:Date.now() }; S.clients.push(c); }
    var wasActive = c.active!==false;
    c.name=f.name.trim(); c.sector=f.sector.trim(); c.phone=f.phone.trim(); c.billing=f.billing; c.amount=num(f.amount); c.note=f.note;

    save(); closeSheet(); render(); toast(id?'انحفظ':'انضاف العميل');
  };
}

function uniq(a){ var o={}, r=[]; a.forEach(function(x){ if(x && !o[x]){ o[x]=1; r.push(x); } }); return r; }


/* =========================================================
   التقارير الشهرية — report per client per month, printed as a
   landscape PDF in the client's own identity (logo + colors).
   ========================================================= */
var WORK_TYPES = ['مونتاج','تصوير','موشن جرافيك','تصميم','تعليق صوتي','تعديلات','أخرى'];
var DEFAULT_BRAND = { logo:'', primary:'#16A34A', soft:'#DCFCE7', dark:'#14532D', accent:'#FDE68A' };
function reportClients(){ return [['salla','سلة']].concat(S.clients.map(function(c){return [c.id,c.name];})); }
function reportClientName(key){ if(key==='salla') return 'سلة'; var c = byId(S.clients,key); return c ? c.name : '—'; }
function brandOf(key){ var b = S.brands[key]; if(!b){ b = S.brands[key] = Object.assign({}, DEFAULT_BRAND); } return b; }
function monthLong(mk){ var p=mk.split('-'); return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}).format(new Date(+p[0],p[1]-1,1)); }
// Arabic counting: 1 مقطع · 2 مقطعين · 3–10 مقاطع · 11+ مقطع
function clipWord(x){ x = Math.round(num(x)); return x===2 ? 'مقطعين' : (x>=3 && x<=10) ? 'مقاطع' : 'مقطع'; }
function reportTotal(r){ return r.items.reduce(function(a,i){return a+num(i.count);},0); }
function lat(x){ return new Intl.NumberFormat('en-US').format(Math.round(x||0)); }   // report uses Western digits like the client's own decks

  var r = UI.reportId && byId(S.reports, UI.reportId);
  if(!r){ UI.reportId = null; return renderReportList(); }
  var b = brandOf(r.client), isSalla = r.client==='salla';
  var mkVideos = isSalla ? videosIn(r.month) : [];
  $('v-reports').innerHTML =
    '<div class="hdr"><h1 class="page-title" style="font-size:24px">تقرير '+esc(reportClientName(r.client))+'</h1><button class="btn btn-ghost btn-sm" data-act="rep-back">رجوع</button></div>'+
    '<div class="card"><div class="row">'+
      fld('العميل','<select id="rep-client">'+reportClients().map(function(c){return '<option value="'+c[0]+'"'+(c[0]===r.client?' selected':'')+'>'+esc(c[1])+'</option>';}).join('')+'</select>')+
      fld('الشهر','<input type="month" id="rep-month" value="'+r.month+'">')+'</div>'+
      '<div class="brand-row"><div class="brand-dots">'+['primary','soft','dark','accent'].map(function(k){return '<i style="background:'+b[k]+'"></i>';}).join('')+'</div>'+
        (b.logo?'<img src="'+b.logo+'" alt="" class="brand-logo">':'<span class="sub" style="margin:0">بدون لوقو</span>')+
        '<button class="btn btn-ghost btn-sm" data-act="rep-brand">هوية العميل</button></div></div>'+
    '<div class="card"><h2 class="sec"><span>وش سويت هالشهر</span><span class="num">'+n(reportTotal(r))+' مقطع</span></h2>'+
      '<ul class="list">'+(r.items.length ? r.items.map(function(it,i){
        return '<li class="item" data-rit="'+it.id+'"><span class="rnum">'+n(i+1)+'</span><div class="t" data-act="rep-item-edit"><b>'+esc(it.title||it.type)+'</b><small>'+esc(it.type)+(it.note?' · '+esc(it.note):'')+'</small></div>'+
          '<span class="chip sun num">× '+n(it.count)+'</span><button class="x" data-act="rep-item-del" aria-label="حذف">'+ico('x')+'</button></li>';
      }).join('') : '<li class="empty">أضف الشغل: النوع، عدد المقاطع، وملاحظة.</li>')+'</ul>'+
      '<form id="rep-add" class="rep-add">'+
        '<div class="row">'+fld('النوع',sel('type',WORK_TYPES.map(function(t){return [t,t];}),'مونتاج'))+fld('عدد المقاطع','<input name="count" inputmode="decimal" value="1" required>')+'</div>'+
        fld('العنوان (اختياري)','<input name="title" placeholder="مثلاً ريلز ديوانية سلة">')+
        fld('ملاحظة (اختياري)','<input name="note" placeholder="مثلاً ٩:١٦ مع سبتايتل">')+
        '<button class="btn btn-mint btn-block">+ أضف للتقرير</button></form>'+
      (isSalla && mkVideos.length ? '<button class="btn btn-line btn-block" style="margin-top:10px" data-act="rep-import">استيراد '+n(mkVideos.length)+' فيديو مسلّم من خط الإنتاج</button>' : '')+
    '</div>'+
    '<div class="card">'+fld('ملاحظات الشهر (تطلع في التقرير)','<textarea id="rep-notes" placeholder="مثلاً: سلّمنا كل الفيديوهات في وقتها، وجربنا هوك الرقم في ٥ مقاطع…">'+esc(r.notes)+'</textarea>')+
      fld('الخطوة الجاية (اختياري)','<textarea id="rep-next" style="min-height:70px" placeholder="مثلاً: نجرب قالب «قيّم متجري» الشهر الجاي">'+esc(r.next)+'</textarea>')+
      (r.videoList && r.videoList.length ? '<label class="switch"><span>أرفق قائمة الفيديوهات ('+n(r.videoList.length)+')</span><input type="checkbox" id="rep-vlist" '+(r.showList!==false?'checked':'')+'></label>' : '')+

    save(); render(); toast('انضاف');

function newReport(client, month){
  client = client || 'salla'; month = month || mkey(new Date());

// keep logos small so localStorage doesn't fill up
function shrinkImage(file, max, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var k = Math.min(1, max/Math.max(img.width,img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/png'));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function reportDoc(r){
  var b = brandOf(r.client), name = reportClientName(r.client), month = monthLong(r.month), total = reportTotal(r);
  var logo = function(cls){ return b.logo ? '<img class="'+cls+'" src="'+b.logo+'" alt="">' : '<div class="'+cls+' wordmark">'+esc(name)+'</div>'; };
  var types = {}; r.items.forEach(function(i){ types[i.type] = (types[i.type]||0) + num(i.count); });
  var typeList = Object.keys(types).sort(function(a,c){return types[c]-types[a];});
  var target = r.client==='salla' ? num(S.settings.videoGoal) : 0;
  var pages = [];
  var foot = function(){ return '<footer><span>التقرير الشهري · '+esc(name)+'</span><span class="pg"></span></footer>'; };
  var head = function(title, sub){ return '<header>'+logo('rlogo')+'<div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div></header>'; };

  // 1. cover
  pages.push('<section class="rpage cover">'+
    '<i class="sh sh1"></i><i class="sh sh2"></i><i class="sh sh3"></i>'+
    logo('clogo')+
    '<div class="ctext"><h1>التقرير الشهري</h1><p>محتوى '+esc(name)+' · '+lat(total)+' '+clipWord(total)+'</p><small>'+month+'</small></div></section>');

  // 2. summary
  var edits = types['مونتاج']||0;
  var stats = '<div class="rstat big"><b>'+lat(total)+'</b><span>'+clipWord(total)+' هالشهر</span>'+(target?'<em>'+lat(edits)+' فيديو مونتاج من أصل '+lat(target)+'</em>':'')+'</div>'+
    typeList.slice(0,3).map(function(t){ return '<div class="rstat"><b>'+lat(types[t])+'</b><span>'+esc(t)+'</span></div>'; }).join('');
  pages.push('<section class="rpage">'+head('ملخص الشهر', month+' · إعداد أسامة أنور')+
    '<div class="rstats">'+stats+'</div>'+
    (target ? '<div class="rprog"><i style="width:'+Math.min(100,edits/target*100)+'%"></i></div>' : '')+
    (r.notes ? '<div class="rbox"><h4>ملاحظات الشهر</h4><p>'+esc(r.notes).replace(/\n/g,'<br>')+'</p></div>' : '')+
    (r.next ? '<div class="rnext"><h4>الخطوة الجاية</h4><p>'+esc(r.next).replace(/\n/g,'<br>')+'</p></div>' : '')+
    foot()+'</section>');

  // 3. details — 6 rows per page
  for(var i=0; i<r.items.length; i+=6){
    pages.push('<section class="rpage">'+head('تفاصيل الشغل', i? 'تابع':'كل اللي انسلّم هالشهر')+'<div class="ritems">'+
      r.items.slice(i,i+6).map(function(it,j){
        return '<div class="ritem"><span class="rbadge">'+(i+j+1)+'</span><div class="rbody"><div class="rtop"><span class="rchip">'+esc(it.type)+'</span><b>'+esc(it.title||it.type)+'</b></div>'+
          (it.note?'<p>'+esc(it.note)+'</p>':'')+'</div><span class="rcount">'+lat(it.count)+' <small>'+clipWord(it.count)+'</small></span></div>';
      }).join('')+'</div>'+foot()+'</section>');
  }

  // 4. optional delivered-videos list — 3 columns × 8 rows per page
  if(r.videoList && r.videoList.length && r.showList!==false){
    for(var k=0; k<r.videoList.length; k+=24){
      pages.push('<section class="rpage">'+head('قائمة الفيديوهات المسلّمة', lat(r.videoList.length)+' فيديو · '+month)+'<ol class="rvlist" style="--start:'+k+'">'+
        r.videoList.slice(k,k+24).map(function(v){ return '<li><b>'+esc(v.name)+'</b>'+(v.date?'<span>'+v.date.slice(8,10)+'/'+v.date.slice(5,7)+'</span>':'')+'</li>'; }).join('')+
        '</ol>'+foot()+'</section>');
    }
  }
  var N = pages.length;
  pages = pages.map(function(p,i){ return p.replace('<span class="pg"></span>','<span class="pg">'+(i+1)+' / '+N+'</span>'); });
  return '<div class="rdoc" style="--p:'+b.primary+';--s:'+b.soft+';--d:'+b.dark+';--a:'+b.accent+'">'+pages.join('')+'</div>';
}

function checkNotify(){
  if(!S.settings.notify || !('Notification' in window) || Notification.permission!=='granted') return;

/* ---------- tasks: add / toggle ---------- */
function addTask(title){
  title = title.trim(); if(!title) return;
  var p = {}, proj = S.settings.projects;
  title = title.replace(/#(\S+)/, function(m,g){ var hit = proj.filter(function(x){return x===g;})[0]; if(hit){p.project=hit; return '';} return m; });
  if(/!\s*$/.test(title) || /^!/.test(title)){ p.priority = 1; title = title.replace(/^!|!\s*$/,''); }
  // \b doesn't work with Arabic letters in JS, so match on spaces/edges
  var TMR = /(^|\s)(بكرة|بكره)(?=\s|$)/, TDY = /(^|\s)اليوم(?=\s|$)/;
  if(TMR.test(title)){ p.date=addDays(dkey(),1); title=title.replace(TMR,' '); }
  else if(TDY.test(title)){ p.date=dkey(); title=title.replace(TDY,' '); }
  if(!p.project && current==='tasks' && UI.taskProj) p.project = UI.taskProj;
  if(!p.date && current==='today') p.date = dkey();   // added from the Today card → it's for today
  S.tasks.push({ id:uid(), title:title.replace(/\s+/g,' ').trim(), project:p.project||'', date:p.date||'', priority:p.priority||2,
    note:'', done:false, doneAt:null, repeat:'', order:Date.now(), createdAt:new Date().toISOString() });
  save(); render();
}
function toggleTask(id, li){
  var x = byId(S.tasks,id); if(!x) return;
  x.done = !x.done; x.doneAt = x.done ? new Date().toISOString() : null;
  var t = dkey(), spawned = null;
  if(x.done){
    if(S.doneDays.indexOf(t)<0) S.doneDays.push(t);
    chime();
    if(x.repeat && !x.spawned){
      var base = x.date || t;
      spawned = { id:uid(), title:x.title, project:x.project, priority:x.priority, note:x.note, repeat:x.repeat, done:false, doneAt:null,
        date: x.repeat==='weekly' ? addDays(base,7) : addMonths(base,1), order:x.order, createdAt:new Date().toISOString() };
      S.tasks.push(spawned); x.spawned = spawned.id;
    }
  } else {
    if(x.spawned){ S.tasks = S.tasks.filter(function(o){return o.id!==x.spawned;}); x.spawned = null; }
    if(!S.tasks.some(function(o){return o.done && (o.doneAt||'').slice(0,10)===t;})) S.doneDays = S.doneDays.filter(function(d){return d!==t;});
  }
  save();
  if(li) li.classList.toggle('done', x.done);
  if(x.done){ var s = $('streak'); if(s){ s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); } }
  setTimeout(function(){ render(); if($('sheet').classList.contains('on') && li && li.closest('#sheet')) doneListSheet(); }, x.done ? 450 : 0);
  if(x.done) toast(spawned ? 'تمت — والجاية '+shortDate(spawned.date) : 'أحسنت — انشطبت', function(){ toggleTask(id, null); });
}
function chime(){
  if(!S.settings.sound) return;
  try{
    var A = window._ac || (window._ac = new (window.AudioContext||window.webkitAudioContext)());
    var o = A.createOscillator(), g = A.createGain(), now = A.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(880,now); o.frequency.exponentialRampToValueAtTime(1320,now+.12);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.08,now+.02); g.gain.exponentialRampToValueAtTime(.0001,now+.25);
    o.connect(g).connect(A.destination); o.start(now); o.stop(now+.26);
  }catch(e){}
}

/* ---------- SVG line chart (hand-drawn, no library) ---------- */
function lineChart(pts, o){
  o = o||{}; var W=320, H=150, pl=8, pr=8, pt=16, pb=26;
  var vals = pts.map(function(p){return p.v;}); if(o.goal) vals.push(o.goal);
  var mx = Math.max.apply(null, vals)*1.15 || 1;
  var x = function(i){ return pl + (pts.length===1?0:(W-pl-pr)*i/(pts.length-1)); }, y = function(v){ return pt + (H-pt-pb)*(1-v/mx); };
  var path = pts.map(function(p,i){ return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1); }).join(' ');
  var area = path+' L'+x(pts.length-1).toFixed(1)+' '+(H-pb)+' L'+x(0).toFixed(1)+' '+(H-pb)+' Z';
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" dir="ltr" role="img">'+
    '<path d="'+area+'" fill="var(--mint-soft)"/>'+
    (o.goal?'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(o.goal)+'" y2="'+y(o.goal)+'" stroke="var(--faint)" stroke-dasharray="4 4"/><text x="'+(W-pr)+'" y="'+(y(o.goal)-5)+'" text-anchor="end">الهدف '+nd(o.goal)+'</text>':'')+
    '<path d="'+path+'" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map(function(p,i){ return '<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="3.5" fill="var(--mint)"/>'+
      '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'">'+esc(p.label)+'</text>'; }).join('')+
    '<text x="'+x(pts.length-1)+'" y="'+(y(pts[pts.length-1].v)-9)+'" text-anchor="end" style="fill:var(--text);font-weight:700">'+nd(pts[pts.length-1].v)+(o.unit||'')+'</text>'+
    '</svg>';
  return '<div class="chart">'+svg+'</div>';
}
